services:

  hadoop:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: datamart-hadoop
    hostname: hadoop
    volumes:
      - ./ventas_125054560.csv:/data/input/ventas_125054560.csv:ro
      - ./mapreduce:/workspace/mapreduce:ro
      - hadoop_output:/data/output
    networks:
      - datamart_network
    ports:
      - "2222:22"

  db:
    image: postgres:16
    container_name: datamart-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datamart_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: datamart-api
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./scripts:/app/scripts:ro
      - hadoop_output:/data/output:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - datamart_network

networks:
  datamart_network:
    driver: bridge

volumes:
  postgres_data:
  hadoop_output: